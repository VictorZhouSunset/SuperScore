[package]
name = "superscore-desktop"
version = "0.1.0"
description = "SuperScore desktop app"
edition = "2021"

[lib]
name = "superscore_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
dirs = "5.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = [] }
thiserror = "1.0"
uuid = { version = "1.10", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.13.0"
